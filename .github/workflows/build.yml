name: Build WhatsApp AI Auto-Responder APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Scaffold Complete Android Project Files
        run: |
          mkdir -p app/src/main/java/com/example/wa_ai_floating
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          # 1. settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "WhatsAppAIFloating"
          include ':app'
          EOF

          # 2. build.gradle
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          EOF

          # 3. gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          # 4. app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'kotlin-android'
          }
          android {
              namespace 'com.example.wa_ai_floating'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.wa_ai_floating"
                  minSdk 24
                  targetSdk 34
                  versionCode 3
                  versionName "3.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
          }
          EOF

          # 5. accessibility_service_config.xml
          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/accessibility_desc"
              android:packageNames="com.whatsapp,com.whatsapp.w4b"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows|flagReportViewIds"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="100"
              android:canRetrieveWindowContent="true" />
          EOF

          # 6. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />

              <application
                  android:allowBackup="true"
                  android:label="WA AI Responder"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".WhatsAppAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>

                  <service
                      android:name=".FloatingBubbleService"
                      android:enabled="true"
                      android:exported="false" />
              </application>
          </manifest>
          EOF

          # 7. MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/example/wa_ai_floating/MainActivity.kt
          package com.example.wa_ai_floating

          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  findViewById<Button>(R.id.btnPermissionOverlay).setOnClickListener {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                          startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                      } else {
                          Toast.makeText(this, "ফ্লোটিং উইন্ডো পারমিশন চালু আছে", Toast.LENGTH_SHORT).show()
                      }
                  }

                  findViewById<Button>(R.id.btnPermissionAccessibility).setOnClickListener {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      Toast.makeText(this, "Installed Apps থেকে 'WA AI Responder' অন করুন", Toast.LENGTH_LONG).show()
                  }

                  findViewById<Button>(R.id.btnStartService).setOnClickListener {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                          Toast.makeText(this, "আগে ফ্লোটিং পারমিশন দিন", Toast.LENGTH_SHORT).show()
                          return@setOnClickListener
                      }
                      startService(Intent(this, FloatingBubbleService::class.java))
                      Toast.makeText(this, "ফ্লোটিং বাবল চালু হয়েছে!", Toast.LENGTH_SHORT).show()
                  }
              }
          }
          EOF

          # 8. WhatsAppAccessibilityService.kt (রিসোর্সফুল স্ক্যান + ফলব্যাক + অটো-সেন্ড)
          cat << 'EOF' > app/src/main/java/com/example/wa_ai_floating/WhatsAppAccessibilityService.kt
          package com.example.wa_ai_floating

          import android.accessibilityservice.AccessibilityService
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.os.Build
          import android.os.Bundle
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import kotlinx.coroutines.*
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL

          class WhatsAppAccessibilityService : AccessibilityService() {

              private val serviceScope = CoroutineScope(Dispatchers.IO + SupervisorJob())
              private var isProcessing = false

              // এখানে আপনার আসল Gemini API Key বসিয়ে নিতে পারেন
              private val GEMINI_API_KEY = "AQ.Ab8RN6Kx0-DwRkxJO3ZZUlDNbC7u1BnFOIuAsN1opA6zNdXHmw"

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  val filter = IntentFilter("ACTION_TRIGGER_AUTO_REPLY")
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      registerReceiver(triggerReceiver, filter, RECEIVER_NOT_EXPORTED)
                  } else {
                      registerReceiver(triggerReceiver, filter)
                  }
              }

              private val triggerReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      if (isProcessing) return
                      processScreenAndReply()
                  }
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}

              private fun processScreenAndReply() {
                  val rootNode = rootInActiveWindow
                  if (rootNode == null) {
                      sendBubbleStatus("স্ক্রিন রিড করা যায়নি")
                      return
                  }

                  val messageList = mutableListOf<String>()
                  extractTextNodes(rootNode, messageList)

                  if (messageList.isEmpty()) {
                      sendBubbleStatus("কোনো টেক্সট পাওয়া যায়নি")
                      return
                  }

                  // একদম শেষ মেসেজটি পিক করা
                  val lastMessage = messageList.last()
                  sendBubbleStatus("মেসেজ: $lastMessage")

                  isProcessing = true
                  serviceScope.launch {
                      val replyText = generateAiReply(lastMessage)

                      withContext(Dispatchers.Main) {
                          typeAndSendMessage(replyText)
                          isProcessing = false
                      }
                  }
              }

              private fun extractTextNodes(node: AccessibilityNodeInfo?, list: MutableList<String>) {
                  if (node == null) return
                  val text = node.text?.toString()?.trim()

                  if (!text.isNullOrEmpty() &&
                      text.length > 1 &&
                      !text.equals("Type a message", ignoreCase = true) &&
                      !text.equals("Message", ignoreCase = true) &&
                      !text.contains("হোয়াটসঅ্যাপ স্ক্রিন") &&
                      !text.matches(Regex("^[0-9]{1,2}:[0-9]{2}(\\s?[APMapm]{2})?$"))
                  ) {
                      list.add(text)
                  }

                  for (i in 0 until node.childCount) {
                      extractTextNodes(node.getChild(i), list)
                  }
              }

              private fun typeAndSendMessage(text: String) {
                  val rootNode = rootInActiveWindow ?: return

                  // হোয়াটসঅ্যাপের মেসেজ বক্স খোঁজা
                  var targetInput = findNodeByViewIds(rootNode, listOf("com.whatsapp:id/entry", "com.whatsapp:id/conversation_text_entry"))
                  if (targetInput == null) {
                      targetInput = findFirstEditText(rootNode)
                  }

                  if (targetInput != null) {
                      // টেক্সট পেস্ট করা
                      val arguments = Bundle().apply {
                          putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, text)
                      }
                      targetInput.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, arguments)
                      sendBubbleStatus("টাইপ হয়েছে, সেন্ড করা হচ্ছে...")

                      // অল্প বিরতি দিয়ে সেন্ড বাটনে ক্লিক
                      serviceScope.launch {
                          delay(500)
                          withContext(Dispatchers.Main) {
                              val currentRoot = rootInActiveWindow ?: return@withContext
                              var sendButton = findNodeByViewIds(currentRoot, listOf("com.whatsapp:id/send", "com.whatsapp:id/send_container"))
                              
                              if (sendButton == null) {
                                  val sendNodes = currentRoot.findAccessibilityNodeInfosByText("Send")
                                  if (sendNodes.isNotEmpty()) sendButton = sendNodes[0]
                              }

                              if (sendButton != null) {
                                  sendButton.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                                  sendBubbleStatus("সফলভাবে রিপ্লাই পাঠানো হয়েছে!")
                              } else {
                                  sendBubbleStatus("টাইপ হয়েছে, Send বাটনে চাপ দিন")
                              }
                          }
                      }
                  } else {
                      sendBubbleStatus("চ্যাট ইনপুট বক্স মেলেনি")
                  }
              }

              private fun findNodeByViewIds(root: AccessibilityNodeInfo, ids: List<String>): AccessibilityNodeInfo? {
                  for (id in ids) {
                      val nodes = root.findAccessibilityNodeInfosByViewId(id)
                      if (nodes.isNotEmpty()) return nodes[0]
                  }
                  return null
              }

              private fun findFirstEditText(node: AccessibilityNodeInfo?): AccessibilityNodeInfo? {
                  if (node == null) return null
                  if (node.className?.contains("EditText") == true) return node
                  for (i in 0 until node.childCount) {
                      val res = findFirstEditText(node.getChild(i))
                      if (res != null) return res
                  }
                  return null
              }

              private suspend fun generateAiReply(userPrompt: String): String {
                  // যদি API Key না দেওয়া থাকে তবে স্মার্ট রুল-বেসড রিপ্লাই দেবে (ফ্রিজ হবে না)
                  if (GEMINI_API_KEY == "YOUR_GEMINI_API_KEY" || GEMINI_API_KEY.isEmpty()) {
                      delay(800)
                      return when {
                          userPrompt.contains("Hi", true) || userPrompt.contains("Hello", true) || userPrompt.contains("Hy", true) -> 
                              "হ্যালো! কেমন আছেন? আমি কীভাবে সাহায্য করতে পারি?"
                          userPrompt.contains("দাম", true) || userPrompt.contains("price", true) -> 
                              "আমাদের পণ্যের বিস্তারিত মূল্য তালিকা ইনবক্সে দেওয়া হচ্ছে।"
                          else -> "জি পেয়েছি। আমি একটু দেখে আপনাকে বিস্তারিত জানাচ্ছি।"
                      }
                  }

                  return withContext(Dispatchers.IO) {
                      try {
                          val url = URL("https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$GEMINI_API_KEY")
                          val conn = (url.openConnection() as HttpURLConnection).apply {
                              requestMethod = "POST"
                              setRequestProperty("Content-Type", "application/json")
                              connectTimeout = 6000
                              readTimeout = 6000
                              doOutput = true
                          }
                          val payload = """
                              {"contents":[{"parts":[{"text":"তুমি একজন বিনয়ী সহকারী। এই মেসেজের সংক্ষিপ্ত ১ লাইনের বাস্তবসম্মত রিপ্লাই দাও:\\n\\n$userPrompt"}]}]}
                          """.trimIndent()
                          conn.outputStream.write(payload.toByteArray(Charsets.UTF_8))
                          val response = conn.inputStream.bufferedReader().use { it.readText() }
                          val json = JSONObject(response)
                          json.getJSONArray("candidates").getJSONObject(0).getJSONObject("content").getJSONArray("parts").getJSONObject(0).getString("text").trim()
                      } catch (e: Exception) {
                          "ধন্যবাদ। আপনার মেসেজটি পেয়েছি, খুব দ্রুত জানাচ্ছি।"
                      }
                  }
              }

              private fun sendBubbleStatus(msg: String) {
                  val intent = Intent("UPDATE_BUBBLE_STATUS").apply {
                      putExtra("status", msg)
                  }
                  sendBroadcast(intent)
              }

              override fun onInterrupt() {}

              override fun onDestroy() {
                  super.onDestroy()
                  serviceScope.cancel()
                  try { unregisterReceiver(triggerReceiver) } catch (e: Exception) {}
              }
          }
          EOF

          # 9. FloatingBubbleService.kt
          cat << 'EOF' > app/src/main/java/com/example/wa_ai_floating/FloatingBubbleService.kt
          package com.example.wa_ai_floating

          import android.annotation.SuppressLint
          import android.app.Service
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.graphics.PixelFormat
          import android.os.Build
          import android.os.IBinder
          import android.view.*
          import android.widget.ImageView
          import android.widget.TextView
          import kotlin.math.abs

          class FloatingBubbleService : Service() {

              private lateinit var windowManager: WindowManager
              private lateinit var floatingView: View
              private lateinit var params: WindowManager.LayoutParams

              private val statusReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      val status = intent?.getStringExtra("status") ?: ""
                      floatingView.findViewById<TextView>(R.id.tvBubbleStatus).text = status
                  }
              }

              @SuppressLint("InflateParams", "ClickableViewAccessibility")
              override fun onCreate() {
                  super.onCreate()
                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                  floatingView = LayoutInflater.from(this).inflate(R.layout.layout_floating_bubble, null)

                  val layoutType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  } else {
                      @Suppress("DEPRECATION")
                      WindowManager.LayoutParams.TYPE_PHONE
                  }

                  params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      layoutType,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = 80
                      y = 300
                  }

                  windowManager.addView(floatingView, params)

                  val bubbleIcon = floatingView.findViewById<ImageView>(R.id.ivBubbleIcon)
                  bubbleIcon.setOnTouchListener(object : View.OnTouchListener {
                      private var initialX = 0
                      private var initialY = 0
                      private var initialTouchX = 0f
                      private var initialTouchY = 0f
                      private var startClickTime = 0L

                      override fun onTouch(v: View?, event: MotionEvent): Boolean {
                          when (event.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  initialX = params.x
                                  initialY = params.y
                                  initialTouchX = event.rawX
                                  initialTouchY = event.rawY
                                  startClickTime = System.currentTimeMillis()
                                  return true
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  params.x = initialX + (event.rawX - initialTouchX).toInt()
                                  params.y = initialY + (event.rawY - initialTouchY).toInt()
                                  windowManager.updateViewLayout(floatingView, params)
                                  return true
                              }
                              MotionEvent.ACTION_UP -> {
                                  val clickDuration = System.currentTimeMillis() - startClickTime
                                  val diffX = abs(event.rawX - initialTouchX)
                                  val diffY = abs(event.rawY - initialTouchY)

                                  if (clickDuration < 350 && diffX < 20 && diffY < 20) {
                                      sendBroadcast(Intent("ACTION_TRIGGER_AUTO_REPLY"))
                                      floatingView.findViewById<TextView>(R.id.tvBubbleStatus).text = "হোয়াটসঅ্যাপ স্ক্রিন স্ক্যান হচ্ছে..."
                                  }
                                  return true
                              }
                          }
                          return false
                      }
                  })

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      registerReceiver(statusReceiver, IntentFilter("UPDATE_BUBBLE_STATUS"), RECEIVER_NOT_EXPORTED)
                  } else {
                      registerReceiver(statusReceiver, IntentFilter("UPDATE_BUBBLE_STATUS"))
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  if (::floatingView.isInitialized) windowManager.removeView(floatingView)
                  unregisterReceiver(statusReceiver)
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

          # 10. Layouts & Drawables
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:padding="24dp"
              android:background="#0F172A">
              
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="WhatsApp Smart AI Responder"
                  android:textColor="#FFFFFF"
                  android:textSize="20sp"
                  android:textStyle="bold"
                  android:layout_marginBottom="32dp"/>

              <Button
                  android:id="@+id/btnPermissionOverlay"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="১. ফ্লোটিং পারমিশন দিন"
                  android:backgroundTint="#2563EB"
                  android:textColor="#FFFFFF"
                  android:layout_marginBottom="16dp"/>

              <Button
                  android:id="@+id/btnPermissionAccessibility"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="২. এক্সেসিবিলিটি পারমিশন দিন"
                  android:backgroundTint="#059669"
                  android:textColor="#FFFFFF"
                  android:layout_marginBottom="16dp"/>

              <Button
                  android:id="@+id/btnStartService"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="৩. ফ্লোটিং বাবল চালু করুন"
                  android:backgroundTint="#7C3AED"
                  android:textColor="#FFFFFF"/>
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/res/layout/layout_floating_bubble.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="wrap_content"
              android:layout_height="wrap_content"
              android:orientation="horizontal"
              android:gravity="center_vertical"
              android:background="@drawable/bubble_bg"
              android:padding="8dp">

              <ImageView
                  android:id="@+id/ivBubbleIcon"
                  android:layout_width="48dp"
                  android:layout_height="48dp"
                  android:src="@android:drawable/stat_notify_chat"
                  android:background="@drawable/circle_green"
                  android:padding="8dp"/>

              <TextView
                  android:id="@+id/tvBubbleStatus"
                  android:layout_width="160dp"
                  android:layout_height="wrap_content"
                  android:layout_marginStart="8dp"
                  android:text="ট্যাপ করলেই AI রিপ্লাই টাইপ করবে"
                  android:textColor="#FFFFFF"
                  android:textSize="12sp"
                  android:maxLines="2"
                  android:ellipsize="end"/>
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bubble_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#E61E293B" />
              <corners android:radius="24dp" />
              <stroke android:width="1dp" android:color="#38BDF8" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/circle_green.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#10B981" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">WA AI Responder</string>
              <string name="accessibility_desc">WhatsApp চ্যাট স্ক্রিন রিড এবং স্বয়ংক্রিয়ভাবে টাইপ ও সেন্ড করার সার্ভিস</string>
          </resources>
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WhatsApp-AI-Floating-APK
