name: Build WhatsApp AI Auto-Responder APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Scaffold Complete Android Project Files
        run: |
          mkdir -p app/src/main/java/com/example/wa_ai_floating
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          # 1. settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "WhatsAppAIFloating"
          include ':app'
          EOF

          # 2. build.gradle
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          EOF

          # 3. gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          # 4. app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'kotlin-android'
          }
          android {
              namespace 'com.example.wa_ai_floating'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.wa_ai_floating"
                  minSdk 24
                  targetSdk 34
                  versionCode 7
                  versionName "7.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
          }
          EOF

          # 5. accessibility_service_config.xml
          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/accessibility_desc"
              android:packageNames="com.whatsapp,com.whatsapp.w4b"
              android:accessibilityEventTypes="typeWindowContentChanged|typeWindowStateChanged"
              android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows|flagReportViewIds"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="250"
              android:canRetrieveWindowContent="true" />
          EOF

          # 6. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />

              <application
                  android:allowBackup="true"
                  android:label="WA AI Responder"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".WhatsAppAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>

                  <service
                      android:name=".FloatingBubbleService"
                      android:enabled="true"
                      android:exported="false" />
              </application>
          </manifest>
          EOF

          # 7. MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/example/wa_ai_floating/MainActivity.kt
          package com.example.wa_ai_floating

          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  findViewById<Button>(R.id.btnPermissionOverlay).setOnClickListener {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                          startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                      } else {
                          Toast.makeText(this, "ফ্লোটিং উইন্ডো পারমিশন চালু আছে", Toast.LENGTH_SHORT).show()
                      }
                  }

                  findViewById<Button>(R.id.btnPermissionAccessibility).setOnClickListener {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      Toast.makeText(this, "Accessibility থেকে 'WA AI Responder' অন করুন", Toast.LENGTH_LONG).show()
                  }

                  findViewById<Button>(R.id.btnStartService).setOnClickListener {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                          Toast.makeText(this, "আগে ফ্লোটিং পারমিশন অন করুন", Toast.LENGTH_SHORT).show()
                          return@setOnClickListener
                      }
                      startService(Intent(this, FloatingBubbleService::class.java))
                      Toast.makeText(this, "ফ্লোটিং বাবল সচল হয়েছে!", Toast.LENGTH_SHORT).show()
                  }
              }
          }
          EOF

          # 8. WhatsAppAccessibilityService.kt (বাস্তবসম্মত প্রসঙ্গের ওপর ভিত্তি করে AI রিপ্লাই)
          cat << 'EOF' > app/src/main/java/com/example/wa_ai_floating/WhatsAppAccessibilityService.kt
          package com.example.wa_ai_floating

          import android.accessibilityservice.AccessibilityService
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.os.Build
          import android.os.Bundle
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import kotlinx.coroutines.*
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL

          class WhatsAppAccessibilityService : AccessibilityService() {

              private val serviceScope = CoroutineScope(Dispatchers.IO + SupervisorJob())
              private var isReplying = false
              private var isAutomationEnabled = true
              
              private var lastRepliedMessage = ""
              private var mySentMessageHistory = mutableSetOf<String>()
              private var debounceJob: Job? = null
              
              // Google AI Studio থেকে নেওয়া কি বসাতে পারেন, অথবা ডিফল্ট রাখা যাবে
              private val GEMINI_API_KEY = "YOUR_GEMINI_API_KEY"

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  val filter = IntentFilter().apply {
                      addAction("ACTION_TOGGLE_AUTOMATION")
                      addAction("ACTION_MANUAL_TRIGGER")
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      registerReceiver(commandReceiver, filter, RECEIVER_NOT_EXPORTED)
                  } else {
                      registerReceiver(commandReceiver, filter)
                  }
                  sendBubbleStatus("অটোমেশন: চালু আছে", false, isAutomationEnabled)
              }

              private val commandReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      when (intent?.action) {
                          "ACTION_TOGGLE_AUTOMATION" -> {
                              isAutomationEnabled = intent.getBooleanExtra("enabled", true)
                              if (!isAutomationEnabled) {
                                  debounceJob?.cancel()
                                  isReplying = false
                                  sendBubbleStatus("অটোমেশন: বন্ধ ⏸️", false, false)
                              } else {
                                  sendBubbleStatus("অটোমেশন: চালু আছে ▶️", false, true)
                              }
                          }
                          "ACTION_MANUAL_TRIGGER" -> {
                              if (isAutomationEnabled) {
                                  lastRepliedMessage = ""
                                  checkAndProcessScreen()
                              }
                          }
                      }
                  }
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (!isAutomationEnabled || event == null || isReplying) return

                  val pkg = event.packageName?.toString() ?: ""
                  if (pkg != "com.whatsapp" && pkg != "com.whatsapp.w4b") return

                  if (event.eventType == AccessibilityEvent.TYPE_WINDOW_CONTENT_CHANGED ||
                      event.eventType == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) {
                      
                      debounceJob?.cancel()
                      debounceJob = serviceScope.launch {
                          delay(1800) // মেসেজ আসা শেষ হওয়া পর্যন্ত অপেক্ষা
                          withContext(Dispatchers.Main) {
                              checkAndProcessScreen()
                          }
                      }
                  }
              }

              private fun checkAndProcessScreen() {
                  if (!isAutomationEnabled || isReplying) return
                  val rootNode = rootInActiveWindow ?: return

                  val inputBox = findInputBox(rootNode) ?: return
                  val messages = mutableListOf<String>()
                  extractMessages(rootNode, messages)

                  if (messages.isEmpty()) return
                  val latestMessage = messages.last()

                  // একই মেসেজ বা নিজের মেসেজ হলে রিপ্লাই যাবে না
                  if (latestMessage == lastRepliedMessage) return
                  if (mySentMessageHistory.contains(latestMessage)) return

                  isReplying = true
                  lastRepliedMessage = latestMessage

                  sendBubbleStatus("📋 মেসেজ রিড হয়েছে...", true, isAutomationEnabled)

                  serviceScope.launch {
                      delay(600)
                      sendBubbleStatus("✍️ AI টাইপ করছে...", true, isAutomationEnabled)
                      
                      // মেসেজের ওপর ভিত্তি করে উত্তর তৈরি
                      val reply = generateContextualAiReply(latestMessage)

                      delay(1800)
                      withContext(Dispatchers.Main) {
                          typeAndSend(reply)
                      }
                  }
              }

              private fun extractMessages(node: AccessibilityNodeInfo?, list: MutableList<String>) {
                  if (node == null) return
                  val text = node.text?.toString()?.trim()

                  if (!text.isNullOrEmpty() &&
                      text.length > 1 &&
                      !text.equals("Type a message", ignoreCase = true) &&
                      !text.equals("Message", ignoreCase = true) &&
                      !text.contains("অটোমেশন:") &&
                      !text.contains("মেসেজ রিড") &&
                      !text.contains("AI টাইপ") &&
                      !text.contains("মেসেজ পাঠানো") &&
                      !text.matches(Regex("^[0-9]{1,2}:[0-9]{2}(\\s?[APMapm]{2})?$"))
                  ) {
                      list.add(text)
                  }

                  for (i in 0 until node.childCount) {
                      extractMessages(node.getChild(i), list)
                  }
              }

              private fun typeAndSend(text: String) {
                  val rootNode = rootInActiveWindow
                  if (rootNode == null) {
                      isReplying = false
                      sendBubbleStatus("অটোমেশন: চালু আছে", false, isAutomationEnabled)
                      return
                  }

                  val targetInput = findInputBox(rootNode)
                  if (targetInput != null) {
                      val bundle = Bundle().apply {
                          putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, text)
                      }
                      targetInput.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, bundle)

                      sendBubbleStatus("🚀 মেসেজ পাঠানো হচ্ছে...", true, isAutomationEnabled)

                      serviceScope.launch {
                          delay(600)
                          withContext(Dispatchers.Main) {
                              val refreshedRoot = rootInActiveWindow
                              if (refreshedRoot != null) {
                                  val sendBtn = findSendButton(refreshedRoot)
                                  if (sendBtn != null) {
                                      sendBtn.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                                      mySentMessageHistory.add(text)
                                      sendBubbleStatus("✅ পাঠানো সম্পন্ন!", false, isAutomationEnabled)
                                  } else {
                                      sendBubbleStatus("টাইপ হয়েছে, সেন্ড চাপুন", false, isAutomationEnabled)
                                  }
                              } else {
                                  sendBubbleStatus("অটোমেশন: চালু আছে", false, isAutomationEnabled)
                              }
                              delay(2000)
                              isReplying = false
                          }
                      }
                  } else {
                      isReplying = false
                      sendBubbleStatus("অটোমেশন: চালু আছে", false, isAutomationEnabled)
                  }
              }

              private fun findInputBox(root: AccessibilityNodeInfo): AccessibilityNodeInfo? {
                  val knownIds = listOf("com.whatsapp:id/entry", "com.whatsapp:id/conversation_text_entry")
                  for (id in knownIds) {
                      val nodes = root.findAccessibilityNodeInfosByViewId(id)
                      if (nodes.isNotEmpty()) return nodes[0]
                  }
                  return findFirstEditText(root)
              }

              private fun findSendButton(root: AccessibilityNodeInfo): AccessibilityNodeInfo? {
                  val knownIds = listOf("com.whatsapp:id/send", "com.whatsapp:id/send_container")
                  for (id in knownIds) {
                      val nodes = root.findAccessibilityNodeInfosByViewId(id)
                      if (nodes.isNotEmpty()) return nodes[0]
                  }
                  val sendNodes = root.findAccessibilityNodeInfosByText("Send")
                  if (sendNodes.isNotEmpty()) return sendNodes[0]
                  return null
              }

              private fun findFirstEditText(node: AccessibilityNodeInfo?): AccessibilityNodeInfo? {
                  if (node == null) return null
                  if (node.className?.contains("EditText") == true) return node
                  for (i in 0 until node.childCount) {
                      val res = findFirstEditText(node.getChild(i))
                      if (res != null) return res
                  }
                  return null
              }

              /**
               * বিপরীত পক্ষ থেকে পাঠানো মেসেজের উপর ভিত্তি করে বাস্তবসম্মত উত্তর তৈরি
               */
              private suspend fun generateContextualAiReply(userPrompt: String): String {
                  // ১. ক্লাউড এআই কল (Gemini API Key থাকলে)
                  if (GEMINI_API_KEY != "YOUR_GEMINI_API_KEY" && GEMINI_API_KEY.isNotEmpty()) {
                      val cloudReply = withContext(Dispatchers.IO) {
                          try {
                              val url = URL("https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$GEMINI_API_KEY")
                              val conn = (url.openConnection() as HttpURLConnection).apply {
                                  requestMethod = "POST"
                                  setRequestProperty("Content-Type", "application/json")
                                  connectTimeout = 5000
                                  readTimeout = 5000
                                  doOutput = true
                              }
                              val systemInstruction = "তুমি একজন বাস্তবসম্মত, বিনয়ী ও বিচক্ষণ ব্যক্তি হিসেবে উত্তর দেবে। কোনো রোবোটিক ভাব থাকবে না। বিপরীত পক্ষের প্রশ্ন বা কথার সরাসরি ১ লাইনের স্বাভাবিক ও বাস্তবসম্মত উত্তর দেবে।"
                              val payload = """
                                  {"contents":[{"parts":[{"text":"$systemInstruction\\n\\nবিপরীত পক্ষের মেসেজ: $userPrompt\\nতোমার বাস্তবসম্মত উত্তর:"}]}]}
                              """.trimIndent()
                              conn.outputStream.write(payload.toByteArray(Charsets.UTF_8))
                              val response = conn.inputStream.bufferedReader().use { it.readText() }
                              val json = JSONObject(response)
                              json.getJSONArray("candidates").getJSONObject(0).getJSONObject("content").getJSONArray("parts").getJSONObject(0).getString("text").trim()
                          } catch (e: Exception) {
                              null
                          }
                      }
                      if (!cloudReply.isNullOrBlank()) return cloudReply
                  }

                  // ২. লোকাল কনটেক্সচুয়াল ইঞ্জিন (যেটি মেসেজের অর্থ ও প্রেক্ষাপট অনুযায়ী বাস্তবসম্মত উত্তর দেবে)
                  val clean = userPrompt.lowercase()
                  return when {
                      // সালাম ও কুশলাদি
                      clean.contains("সালাম") || clean.contains("slam") || clean.contains("assalamu") -> 
                          "ওয়ালাইকুম আসসালাম। কেমন আছেন?"
                      clean.contains("কেমন আছ") || clean.contains("kemon") || clean.contains("how are you") -> 
                          "আলহামদুলিল্লাহ ভালো আছি। আপনার দিনকাল কেমন যাচ্ছে?"
                      clean.contains("hi") || clean.contains("hello") || clean.contains("hy") || clean.contains("hey") -> 
                          "হ্যালো! বলুন, কী খবর?"

                      // খোঁজখবর ও অবস্থান
                      clean.contains("কই") || clean.contains("কোথায়") || clean.contains("where") -> 
                          "একটু কাজে আছি, কিছু বলবেন?"
                      clean.contains("আছেন") || clean.contains("online") || clean.contains("achen") -> 
                          "জি লাইনে আছি, বলুন।"
                      clean.contains("ফ্রি") || clean.contains("free") || clean.contains("সময়") -> 
                          "জি বলুন, শুনতে পাচ্ছি।"

                      // কেনাবেচা বা দরদাম
                      clean.contains("দাম") || clean.contains("price") || clean.contains("rate") || clean.contains("টাকা") -> 
                          "এটির বর্তমান প্রাইস ও বিস্তারিত ইনবক্সে শেয়ার করছি।"
                      clean.contains("পণ্য") || clean.contains("product") || clean.contains("অর্ডার") || clean.contains("order") -> 
                          "জি এভেইলেবল আছে। আপনি কয়টি নিতে চাচ্ছেন?"
                      clean.contains("ডেলিভারি") || clean.contains("delivery") -> 
                          "সারা দেশেই ডেলিভারি দেওয়া যাবে, আপনার লোকেশন কোথায়?"

                      // কৃতজ্ঞতা ও সম্মতি
                      clean.contains("ধন্যবাদ") || clean.contains("thanks") || clean.contains("thank you") -> 
                          "আপনাকেও অনেক ধন্যবাদ!"
                      clean.contains("ঠিক আছে") || clean.contains("ok") || clean.contains("accha") || clean.contains("আচ্ছা") -> 
                          "জি ঠিক আছে।"

                      // সাধারণ বা অন্যান্য মেসেজ
                      else -> "জি আপনার মেসেজটি পেয়েছি। একটু পর বিস্তারিত কথা বলছি।"
                  }
              }

              private fun sendBubbleStatus(msg: String, isWorking: Boolean, isEnabled: Boolean) {
                  val intent = Intent("UPDATE_BUBBLE_STATUS").apply {
                      putExtra("status", msg)
                      putExtra("isWorking", isWorking)
                      putExtra("isEnabled", isEnabled)
                  }
                  sendBroadcast(intent)
              }

              override fun onInterrupt() {}

              override fun onDestroy() {
                  super.onDestroy()
                  serviceScope.cancel()
                  try { unregisterReceiver(commandReceiver) } catch (e: Exception) {}
              }
          }
          EOF

          # 9. FloatingBubbleService.kt (অ্যানিমেটেড বাবল ও টগল সুইচ)
          cat << 'EOF' > app/src/main/java/com/example/wa_ai_floating/FloatingBubbleService.kt
          package com.example.wa_ai_floating

          import android.animation.ObjectAnimator
          import android.animation.ValueAnimator
          import android.annotation.SuppressLint
          import android.app.Service
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.os.Build
          import android.os.IBinder
          import android.view.*
          import android.widget.Button
          import android.widget.ImageView
          import android.widget.TextView
          import kotlin.math.abs

          class FloatingBubbleService : Service() {

              private lateinit var windowManager: WindowManager
              private lateinit var floatingView: View
              private lateinit var params: WindowManager.LayoutParams
              private lateinit var bubbleIcon: ImageView
              private lateinit var statusText: TextView
              private lateinit var btnToggle: Button
              
              private var pulseAnimator: ObjectAnimator? = null
              private var isAutomationActive = true

              private val statusReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      val status = intent?.getStringExtra("status") ?: ""
                      val isWorking = intent?.getBooleanExtra("isWorking", false) ?: false
                      val isEnabled = intent?.getBooleanExtra("isEnabled", true) ?: true

                      statusText.text = status
                      isAutomationActive = isEnabled
                      updateToggleUI()

                      if (isWorking) {
                          bubbleIcon.setImageResource(android.R.drawable.ic_menu_edit)
                          bubbleIcon.setBackgroundResource(R.drawable.circle_amber)
                          startPulse()
                      } else {
                          stopPulse()
                          if (isAutomationActive) {
                              bubbleIcon.setImageResource(android.R.drawable.stat_notify_chat)
                              bubbleIcon.setBackgroundResource(R.drawable.circle_green)
                          } else {
                              bubbleIcon.setImageResource(android.R.drawable.ic_delete)
                              bubbleIcon.setBackgroundResource(R.drawable.circle_red)
                          }
                      }
                  }
              }

              @SuppressLint("InflateParams", "ClickableViewAccessibility")
              override fun onCreate() {
                  super.onCreate()
                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                  floatingView = LayoutInflater.from(this).inflate(R.layout.layout_floating_bubble, null)

                  bubbleIcon = floatingView.findViewById(R.id.ivBubbleIcon)
                  statusText = floatingView.findViewById(R.id.tvBubbleStatus)
                  btnToggle = floatingView.findViewById(R.id.btnToggleAutomation)

                  val layoutType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  } else {
                      @Suppress("DEPRECATION")
                      WindowManager.LayoutParams.TYPE_PHONE
                  }

                  params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      layoutType,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = 40
                      y = 260
                  }

                  windowManager.addView(floatingView, params)

                  btnToggle.setOnClickListener {
                      isAutomationActive = !isAutomationActive
                      val toggleIntent = Intent("ACTION_TOGGLE_AUTOMATION").apply {
                          putExtra("enabled", isAutomationActive)
                      }
                      sendBroadcast(toggleIntent)
                      updateToggleUI()
                  }

                  bubbleIcon.setOnTouchListener(object : View.OnTouchListener {
                      private var initialX = 0
                      private var initialY = 0
                      private var initialTouchX = 0f
                      private var initialTouchY = 0f
                      private var startClickTime = 0L

                      override fun onTouch(v: View?, event: MotionEvent): Boolean {
                          when (event.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  initialX = params.x
                                  initialY = params.y
                                  initialTouchX = event.rawX
                                  initialTouchY = event.rawY
                                  startClickTime = System.currentTimeMillis()
                                  return true
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  params.x = initialX + (event.rawX - initialTouchX).toInt()
                                  params.y = initialY + (event.rawY - initialTouchY).toInt()
                                  windowManager.updateViewLayout(floatingView, params)
                                  return true
                              }
                              MotionEvent.ACTION_UP -> {
                                  val clickDuration = System.currentTimeMillis() - startClickTime
                                  val diffX = abs(event.rawX - initialTouchX)
                                  val diffY = abs(event.rawY - initialTouchY)

                                  if (clickDuration < 300 && diffX < 20 && diffY < 20) {
                                      sendBroadcast(Intent("ACTION_MANUAL_TRIGGER"))
                                      statusText.text = "ম্যানুয়াল চেক..."
                                  }
                                  return true
                              }
                          }
                          return false
                      }
                  })

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      registerReceiver(statusReceiver, IntentFilter("UPDATE_BUBBLE_STATUS"), RECEIVER_NOT_EXPORTED)
                  } else {
                      registerReceiver(statusReceiver, IntentFilter("UPDATE_BUBBLE_STATUS"))
                  }
              }

              private fun updateToggleUI() {
                  if (isAutomationActive) {
                      btnToggle.text = "ON"
                      btnToggle.setBackgroundColor(Color.parseColor("#10B981"))
                      bubbleIcon.setBackgroundResource(R.drawable.circle_green)
                  } else {
                      btnToggle.text = "OFF"
                      btnToggle.setBackgroundColor(Color.parseColor("#EF4444"))
                      bubbleIcon.setBackgroundResource(R.drawable.circle_red)
                  }
              }

              private fun startPulse() {
                  if (pulseAnimator == null) {
                      pulseAnimator = ObjectAnimator.ofFloat(bubbleIcon, "alpha", 1f, 0.35f, 1f).apply {
                          duration = 750
                          repeatCount = ValueAnimator.INFINITE
                      }
                  }
                  if (pulseAnimator?.isRunning == false) {
                      pulseAnimator?.start()
                  }
              }

              private fun stopPulse() {
                  pulseAnimator?.cancel()
                  bubbleIcon.alpha = 1.0f
              }

              override fun onDestroy() {
                  super.onDestroy()
                  stopPulse()
                  if (::floatingView.isInitialized) windowManager.removeView(floatingView)
                  unregisterReceiver(statusReceiver)
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

