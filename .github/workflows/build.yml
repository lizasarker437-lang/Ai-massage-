name: Build WhatsApp AI Auto-Responder APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Scaffold Complete Android Project Files
        run: |
          mkdir -p app/src/main/java/com/example/wa_ai_floating
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          # 1. settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "WhatsAppAIFloating"
          include ':app'
          EOF

          # 2. build.gradle
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          EOF

          # 3. gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          # 4. app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'kotlin-android'
          }
          android {
              namespace 'com.example.wa_ai_floating'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.wa_ai_floating"
                  minSdk 24
                  targetSdk 34
                  versionCode 4
                  versionName "4.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
          }
          EOF

          # 5. accessibility_service_config.xml
          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/accessibility_desc"
              android:packageNames="com.whatsapp,com.whatsapp.w4b"
              android:accessibilityEventTypes="typeWindowContentChanged|typeWindowStateChanged"
              android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows|flagReportViewIds"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="200"
              android:canRetrieveWindowContent="true" />
          EOF

          # 6. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />

              <application
                  android:allowBackup="true"
                  android:label="WA AI Auto"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".WhatsAppAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>

                  <service
                      android:name=".FloatingBubbleService"
                      android:enabled="true"
                      android:exported="false" />
              </application>
          </manifest>
          EOF

          # 7. MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/example/wa_ai_floating/MainActivity.kt
          package com.example.wa_ai_floating

          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  findViewById<Button>(R.id.btnPermissionOverlay).setOnClickListener {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                          startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                      } else {
                          Toast.makeText(this, "ফ্লোটিং পারমিশন সচল আছে", Toast.LENGTH_SHORT).show()
                      }
                  }

                  findViewById<Button>(R.id.btnPermissionAccessibility).setOnClickListener {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      Toast.makeText(this, "Accessibility থেকে 'WA AI Auto' চালু করুন", Toast.LENGTH_LONG).show()
                  }

                  findViewById<Button>(R.id.btnStartService).setOnClickListener {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                          Toast.makeText(this, "আগে ফ্লোটিং পারমিশন অন করুন", Toast.LENGTH_SHORT).show()
                          return@setOnClickListener
                      }
                      startService(Intent(this, FloatingBubbleService::class.java))
                      Toast.makeText(this, "অটো-রিপ্লাই বাবল চালু হয়েছে!", Toast.LENGTH_SHORT).show()
                  }
              }
          }
          EOF

          # 8. WhatsAppAccessibilityService.kt (স্মার্ট অটো-ডিটেকশন, ২ সেকেন্ড ডিলে ও টাইপ-সেন্ড)
          cat << 'EOF' > app/src/main/java/com/example/wa_ai_floating/WhatsAppAccessibilityService.kt
          package com.example.wa_ai_floating

          import android.accessibilityservice.AccessibilityService
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.os.Build
          import android.os.Bundle
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import kotlinx.coroutines.*
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL

          class WhatsAppAccessibilityService : AccessibilityService() {

              private val serviceScope = CoroutineScope(Dispatchers.IO + SupervisorJob())
              private var isReplying = false
              private var lastProcessedMessage = ""
              private var pendingJob: Job? = null
              private val GEMINI_API_KEY = "YOUR_GEMINI_API_KEY"

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  val filter = IntentFilter("ACTION_MANUAL_TRIGGER")
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      registerReceiver(manualTriggerReceiver, filter, RECEIVER_NOT_EXPORTED)
                  } else {
                      registerReceiver(manualTriggerReceiver, filter)
                  }
                  sendBubbleStatus("অটো-ডিটেকশন চালু আছে")
              }

              private val manualTriggerReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      lastProcessedMessage = "" // ম্যানুয়াল ক্লিকে ফোর্স ট্রিগার
                      handleChatScreen()
                  }
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event == null || isReplying) return

                  val pkg = event.packageName?.toString() ?: ""
                  if (pkg != "com.whatsapp" && pkg != "com.whatsapp.w4b") return

                  // নতুন কোনো মেসেজ স্ক্রিনে আসলে ২ সেকেন্ড ডি-বাউন্স ডিলে নিয়ে প্রসেস করবে
                  if (event.eventType == AccessibilityEvent.TYPE_WINDOW_CONTENT_CHANGED ||
                      event.eventType == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) {
                      
                      pendingJob?.cancel()
                      pendingJob = serviceScope.launch {
                          delay(2000) // মেসেজ আসার পর ২ সেকেন্ড অপেক্ষা
                          withContext(Dispatchers.Main) {
                              handleChatScreen()
                          }
                      }
                  }
              }

              private fun handleChatScreen() {
                  if (isReplying) return
                  val rootNode = rootInActiveWindow ?: return

                  // চ্যাট স্ক্রিন কি না তা নিশ্চিত হওয়া (ইনপুট বক্স আছে কিনা)
                  val inputNode = findInputBox(rootNode) ?: return

                  val messageList = mutableListOf<String>()
                  extractIncomingMessages(rootNode, messageList)

                  if (messageList.isEmpty()) return
                  val latestMessage = messageList.last()

                  // পূর্বে পাঠানো বা রিপ্লাই দেওয়া মেসেজ হলে এড়িয়ে যাওয়া
                  if (latestMessage == lastProcessedMessage) return

                  isReplying = true
                  lastProcessedMessage = latestMessage
                  sendBubbleStatus("রিড: $latestMessage")

                  serviceScope.launch {
                      sendBubbleStatus("AI টাইপ করছে...")
                      val reply = generateAiReply(latestMessage)
                      
                      delay(1200) // মানুষের মতো স্বাভাবিক টাইপিং টাইম
                      withContext(Dispatchers.Main) {
                          typeAndSend(reply)
                      }
                  }
              }

              private fun extractIncomingMessages(node: AccessibilityNodeInfo?, list: MutableList<String>) {
                  if (node == null) return
                  val text = node.text?.toString()?.trim()

                  if (!text.isNullOrEmpty() &&
                      text.length > 1 &&
                      !text.equals("Type a message", ignoreCase = true) &&
                      !text.equals("Message", ignoreCase = true) &&
                      !text.contains("অটো-ডিটেকশন") &&
                      !text.contains("AI টাইপ") &&
                      !text.contains("হোয়াটসঅ্যাপ") &&
                      !text.matches(Regex("^[0-9]{1,2}:[0-9]{2}(\\s?[APMapm]{2})?$"))
                  ) {
                      list.add(text)
                  }

                  for (i in 0 until node.childCount) {
                      extractIncomingMessages(node.getChild(i), list)
                  }
              }

              private fun typeAndSend(text: String) {
                  val rootNode = rootInActiveWindow
                  if (rootNode == null) {
                      isReplying = false
                      return
                  }

                  val targetInput = findInputBox(rootNode)
                  if (targetInput != null) {
                      // ইনপুট বক্সে মেসেজ সেট করা
                      val bundle = Bundle().apply {
                          putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, text)
                      }
                      targetInput.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, bundle)

                      // সেন্ড বাটনে স্বয়ংক্রিয় ক্লিক
                      serviceScope.launch {
                          delay(600)
                          withContext(Dispatchers.Main) {
                              val refreshedRoot = rootInActiveWindow
                              if (refreshedRoot != null) {
                                  val sendButton = findSendButton(refreshedRoot)
                                  if (sendButton != null) {
                                      sendButton.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                                      sendBubbleStatus("পাঠানো হয়েছে: $text")
                                  } else {
                                      sendBubbleStatus("টাইপ হয়েছে, সেন্ড চাপুন")
                                  }
                              }
                              delay(2000)
                              isReplying = false
                          }
                      }
                  } else {
                      isReplying = false
                  }
              }

              private fun findInputBox(root: AccessibilityNodeInfo): AccessibilityNodeInfo? {
                  val knownIds = listOf("com.whatsapp:id/entry", "com.whatsapp:id/conversation_text_entry")
                  for (id in knownIds) {
                      val nodes = root.findAccessibilityNodeInfosByViewId(id)
                      if (nodes.isNotEmpty()) return nodes[0]
                  }
                  return findFirstEditText(root)
              }

              private fun findSendButton(root: AccessibilityNodeInfo): AccessibilityNodeInfo? {
                  val knownIds = listOf("com.whatsapp:id/send", "com.whatsapp:id/send_container")
                  for (id in knownIds) {
                      val nodes = root.findAccessibilityNodeInfosByViewId(id)
                      if (nodes.isNotEmpty()) return nodes[0]
                  }
                  val sendNodes = root.findAccessibilityNodeInfosByText("Send")
                  if (sendNodes.isNotEmpty()) return sendNodes[0]
                  return null
              }

              private fun findFirstEditText(node: AccessibilityNodeInfo?): AccessibilityNodeInfo? {
                  if (node == null) return null
                  if (node.className?.contains("EditText") == true) return node
                  for (i in 0 until node.childCount) {
                      val res = findFirstEditText(node.getChild(i))
                      if (res != null) return res
                  }
                  return null
              }

              private suspend fun generateAiReply(userPrompt: String): String {
                  if (GEMINI_API_KEY == "YOUR_GEMINI_API_KEY" || GEMINI_API_KEY.isEmpty()) {
                      return when {
                          userPrompt.contains("Hi", true) || userPrompt.contains("Hello", true) || userPrompt.contains("Hy", true) -> 
                              "হ্যালো! কেমন আছেন? কী প্রয়োজনে মেসেজ দিয়েছেন জানাবেন।"
                          userPrompt.contains("দাম", true) || userPrompt.contains("price", true) -> 
                              "আমাদের পণ্যের বিস্তারিত মূল্য তালিকা দেওয়া হচ্ছে।"
                          userPrompt.contains("আছেন", true) -> 
                              "জি, আমি লাইনে আছি। বলুন।"
                          else -> "জি ধন্যবাদ। আপনার বিষয়টি লক্ষ্য করেছি, দ্রুত ব্যবস্থা নিচ্ছি।"
                      }
                  }

                  return withContext(Dispatchers.IO) {
                      try {
                          val url = URL("https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$GEMINI_API_KEY")
                          val conn = (url.openConnection() as HttpURLConnection).apply {
                              requestMethod = "POST"
                              setRequestProperty("Content-Type", "application/json")
                              connectTimeout = 5000
                              readTimeout = 5000
                              doOutput = true
                          }
                          val payload = """
                              {"contents":[{"parts":[{"text":"তুমি একজন বিনয়ী এবং বুদ্ধিমান সহকারী। নিচের মেসেজের খুব সংক্ষিপ্ত ১ লাইনের চমৎকার বাস্তবসম্মত উত্তর দাও:\\n\\n$userPrompt"}]}]}
                          """.trimIndent()
                          conn.outputStream.write(payload.toByteArray(Charsets.UTF_8))
                          val response = conn.inputStream.bufferedReader().use { it.readText() }
                          val json = JSONObject(response)
                          json.getJSONArray("candidates").getJSONObject(0).getJSONObject("content").getJSONArray("parts").getJSONObject(0).getString("text").trim()
                      } catch (e: Exception) {
                          "ধন্যবাদ। আপনার মেসেজটি গ্রহণ করা হয়েছে।"
                      }
                  }
              }

              private fun sendBubbleStatus(msg: String) {
                  val intent = Intent("UPDATE_BUBBLE_STATUS").apply {
                      putExtra("status", msg)
                  }
                  sendBroadcast(intent)
              }

              override fun onInterrupt() {}

              override fun onDestroy() {
                  super.onDestroy()
                  serviceScope.cancel()
                  try { unregisterReceiver(manualTriggerReceiver) } catch (e: Exception) {}
              }
          }
          EOF

          # 9. FloatingBubbleService.kt (ড্র্যাগেবল ইন্টারফেস ও ইনস্ট্যান্ট স্ট্যাটাস)
          cat << 'EOF' > app/src/main/java/com/example/wa_ai_floating/FloatingBubbleService.kt
          package com.example.wa_ai_floating

          import android.annotation.SuppressLint
          import android.app.Service
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.graphics.PixelFormat
          import android.os.Build
          import android.os.IBinder
          import android.view.*
          import android.widget.ImageView
          import android.widget.TextView
          import kotlin.math.abs

          class FloatingBubbleService : Service() {

              private lateinit var windowManager: WindowManager
              private lateinit var floatingView: View
              private lateinit var params: WindowManager.LayoutParams

              private val statusReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      val status = intent?.getStringExtra("status") ?: ""
                      floatingView.findViewById<TextView>(R.id.tvBubbleStatus).text = status
                  }
              }

              @SuppressLint("InflateParams", "ClickableViewAccessibility")
              override fun onCreate() {
                  super.onCreate()
                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                  floatingView = LayoutInflater.from(this).inflate(R.layout.layout_floating_bubble, null)

                  val layoutType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  } else {
                      @Suppress("DEPRECATION")
                      WindowManager.LayoutParams.TYPE_PHONE
                  }

                  params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      layoutType,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = 60
                      y = 280
                  }

                  windowManager.addView(floatingView, params)

                  val bubbleIcon = floatingView.findViewById<ImageView>(R.id.ivBubbleIcon)
                  bubbleIcon.setOnTouchListener(object : View.OnTouchListener {
                      private var initialX = 0
                      private var initialY = 0
                      private var initialTouchX = 0f
                      private var initialTouchY = 0f
                      private var startClickTime = 0L

                      override fun onTouch(v: View?, event: MotionEvent): Boolean {
                          when (event.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  initialX = params.x
                                  initialY = params.y
                                  initialTouchX = event.rawX
                                  initialTouchY = event.rawY
                                  startClickTime = System.currentTimeMillis()
                                  return true
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  params.x = initialX + (event.rawX - initialTouchX).toInt()
                                  params.y = initialY + (event.rawY - initialTouchY).toInt()
                                  windowManager.updateViewLayout(floatingView, params)
                                  return true
                              }
                              MotionEvent.ACTION_UP -> {
                                  val clickDuration = System.currentTimeMillis() - startClickTime
                                  val diffX = abs(event.rawX - initialTouchX)
                                  val diffY = abs(event.rawY - initialTouchY)

                                  // ক্লিক করলে যেকোনো সময় ইনস্ট্যান্ট জোরপূর্বক রিপ্লাই ট্রিগার হবে
                                  if (clickDuration < 350 && diffX < 20 && diffY < 20) {
                                      sendBroadcast(Intent("ACTION_MANUAL_TRIGGER"))
                                      floatingView.findViewById<TextView>(R.id.tvBubbleStatus).text = "চেক করা হচ্ছে..."
                                  }
                                  return true
                              }
                          }
                          return false
                      }
                  })

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      registerReceiver(statusReceiver, IntentFilter("UPDATE_BUBBLE_STATUS"), RECEIVER_NOT_EXPORTED)
                  } else {
                      registerReceiver(statusReceiver, IntentFilter("UPDATE_BUBBLE_STATUS"))
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  if (::floatingView.isInitialized) windowManager.removeView(floatingView)
                  unregisterReceiver(statusReceiver)
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

          # 10. Layouts & Drawables
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:padding="24dp"
              android:background="#0F172A">
              
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="WhatsApp AI Auto Agent"
                  android:textColor="#FFFFFF"
                  android:textSize="20sp"
                  android:textStyle="bold"
                  android:layout_marginBottom="32dp"/>

              <Button
                  android:id="@+id/btnPermissionOverlay"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="১. ফ্লোটিং পারমিশন দিন"
                  android:backgroundTint="#2563EB"
                  android:textColor="#FFFFFF"
                  android:layout_marginBottom="16dp"/>

              <Button
                  android:id="@+id/btnPermissionAccessibility"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="২. এক্সেসিবিলিটি সার্ভিস চালু করুন"
                  android:backgroundTint="#059669"
                  android:textColor="#FFFFFF"
                  android:layout_marginBottom="16dp"/>

              <Button
                  android:id="@+id/btnStartService"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="৩. ফ্লোটিং বাবল স্টার্ট করুন"
                  android:backgroundTint="#7C3AED"
                  android:textColor="#FFFFFF"/>
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/res/layout/layout_floating_bubble.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="wrap_content"
              android:layout_height="wrap_content"
              android:orientation="horizontal"
              android:gravity="center_vertical"
              android:background="@drawable/bubble_bg"
              android:padding="8dp">

              <ImageView
                  android:id="@+id/ivBubbleIcon"
                  android:layout_width="44dp"
                  android:layout_height="44dp"
                  android:src="@android:drawable/stat_notify_chat"
                  android:background="@drawable/circle_green"
                  android:padding="8dp"/>

              <TextView
                  android:id="@+id/tvBubbleStatus"
                  android:layout_width="165dp"
                  android:layout_height="wrap_content"
                  android:layout_marginStart="8dp"
                  android:text="অটো-ডিটেকশন চালু আছে"
                  android:textColor="#FFFFFF"
                  android:textSize="12sp"
                  android:maxLines="2"
                  android:ellipsize="end"/>
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bubble_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#E61E293B" />
              <corners android:radius="24dp" />
              <stroke android:width="1dp" android:color="#38BDF8" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/circle_green.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#10B981" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">WA AI Auto</string>
              <string name="accessibility_desc">WhatsApp স্ক্রিন অটো-রিড ও অটো-টাইপ করার সার্ভিস</string>
          </resources>
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WhatsApp-AI-Auto-APK
          path: app/build/outputs/apk/debug/*.apk
