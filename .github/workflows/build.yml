name: Build WA AI Responder APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Complete Android Project Automatically
        run: |
          mkdir -p app/src/main/java/com/example/waairesp
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          # settings.gradle
          echo 'pluginManagement { repositories { google() mavenCentral() gradlePluginPortal() } } dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS) repositories { google() mavenCentral() } } rootProject.name = "WAAIAutoResponder" include ":app"' > settings.gradle

          # build.gradle (Project)
          echo 'plugins { id "com.android.application" version "8.2.0" apply false id "org.jetbrains.kotlin.android" version "1.9.20" apply false }' > build.gradle

          # gradle.properties
          echo -e "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\nandroid.useAndroidX=true\nkotlin.code.style=official\nandroid.nonTransitiveRClass=true" > gradle.properties

          # app/build.gradle
          echo 'plugins { id "com.android.application" id "org.jetbrains.kotlin.android" } android { namespace "com.example.waairesp" compileSdk 34 defaultConfig { applicationId "com.example.waairesp" minSdk 24 targetSdk 34 versionCode 1 versionName "1.0" } buildTypes { release { minifyEnabled false } } compileOptions { sourceCompatibility JavaVersion.VERSION_17 targetCompatibility JavaVersion.VERSION_17 } kotlinOptions { jvmTarget = "17" } } dependencies { implementation "androidx.core:core-ktx:1.12.0" implementation "androidx.appcompat:appcompat:1.6.1" implementation "com.google.android.material:material:1.11.0" implementation "com.google.ai.client.generativeai:generativeai:0.2.0" }' > app/build.gradle

          # AndroidManifest.xml
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET" /><uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" /><uses-permission android:name="android.permission.BIND_ACCESSIBILITY_SERVICE" /><uses-permission android:name="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE" /><uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" /><uses-permission android:name="android.permission.WAKE_LOCK" /><application android:allowBackup="true" android:label="WA Ai Auto Responder" android:supportsRtl="true" android:theme="@style/Theme.AppCompat.Light.NoActionBar"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter></activity><service android:name=".AIWhatsAppService" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE" android:exported="false"><intent-filter><action android:name="android.accessibilityservice.AccessibilityService" /></intent-filter><meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility_service_config" /></service><service android:name=".WA_NotificationListener" android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE" android:exported="false"><intent-filter><action android:name="android.service.notification.NotificationListenerService" /></intent-filter></service></application></manifest>' > app/src/main/AndroidManifest.xml

          # accessibility_service_config.xml
          echo '<accessibility-service xmlns:android="http://schemas.android.com/apk/res/android" android:accessibilityEventTypes="typeWindowContentChanged|typeWindowStateChanged" android:accessibilityFeedbackType="feedbackGeneric" android:canPerformGestures="true" android:canRetrieveWindowContent="true" android:description="@string/accessibility_desc" />' > app/src/main/res/xml/accessibility_service_config.xml

          # strings.xml
          echo '<resources><string name="app_name">WA Ai Auto Responder</string><string name="accessibility_desc">WhatsApp AI Auto Responder Accessibility Service</string></resources>' > app/src/main/res/values/strings.xml

          # activity_main.xml
          echo '<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:background="#F0FDF4" android:padding="20dp"><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="🤖 Gemini AI WhatsApp Bot" android:textSize="22sp" android:textStyle="bold" android:textColor="#047857" android:layout_marginBottom="16dp"/><TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:text="আপনার Gemini API Key দিন:" android:textSize="14sp" android:textColor="#334155" android:layout_marginBottom="8dp"/><EditText android:id="@+id/apiKeyInput" android:layout_width="match_parent" android:layout_height="wrap_content" android:hint="AIzaSy..." android:inputType="textPassword" android:textSize="14sp" android:background="#FFFFFF" android:padding="12dp" android:layout_marginBottom="12dp"/><Button android:id="@+id/saveKeyBtn" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="API Key সংরক্ষণ করুন" android:backgroundTint="#059669" android:textColor="#FFFFFF" android:layout_marginBottom="12dp"/><Button android:id="@+id/accessibilityBtn" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="⚙️ ACCESSIBILITY পার্মিশন অন করুন" android:backgroundTint="#0D9488" android:textColor="#FFFFFF" android:layout_marginBottom="12dp"/><Button android:id="@+id/notificationPermBtn" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="🔔 NOTIFICATION ACCESS পার্মিশন দিন" android:backgroundTint="#2563EB" android:textColor="#FFFFFF" android:layout_marginBottom="16dp"/><TextView android:id="@+id/statusText" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="স্ট্যাটাস..." android:textSize="14sp" android:textStyle="bold" android:textColor="#1E293B" android:padding="12dp" android:background="#DCFCE7"/></LinearLayout>' > app/src/main/res/layout/activity_main.xml

          # MainActivity.kt
          echo 'package com.example.waairesp
          import android.content.Context
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.EditText
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          class MainActivity : AppCompatActivity() {
              private lateinit var apiKeyInput: EditText
              private lateinit var saveKeyBtn: Button
              private lateinit var accessibilityBtn: Button
              private lateinit var notificationPermBtn: Button
              private lateinit var statusText: TextView
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  apiKeyInput = findViewById(R.id.apiKeyInput)
                  saveKeyBtn = findViewById(R.id.saveKeyBtn)
                  accessibilityBtn = findViewById(R.id.accessibilityBtn)
                  notificationPermBtn = findViewById(R.id.notificationPermBtn)
                  statusText = findViewById(R.id.statusText)
                  val prefs = getSharedPreferences("ai_bot_prefs", Context.MODE_PRIVATE)
                  apiKeyInput.setText(prefs.getString("gemini_key", ""))
                  saveKeyBtn.setOnClickListener {
                      val key = apiKeyInput.text.toString().trim()
                      if (key.isNotEmpty()) {
                          prefs.edit().putString("gemini_key", key).apply()
                          Toast.makeText(this, "API Key সংরক্ষিত হয়েছে!", Toast.LENGTH_SHORT).show()
                      } else {
                          Toast.makeText(this, "দয়া করে সঠিক Key দিন", Toast.LENGTH_SHORT).show()
                      }
                  }
                  accessibilityBtn.setOnClickListener {
                      try { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) } catch (e: Exception) {}
                  }
                  notificationPermBtn.setOnClickListener {
                      try { startActivity(Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS)) } catch (e: Exception) {}
                  }
              }
              override fun onResume() {
                  super.onResume()
                  val isAccEnabled = AIWhatsAppService.instance != null
                  statusText.text = if (isAccEnabled) "স্ট্যাটাস: সার্ভিস সচল ও প্রস্তুত ✅" else "স্ট্যাটাস: Accessibility বা Notification পার্মিশন দিন ❌"
              }
          }' > app/src/main/java/com/example/waairesp/MainActivity.kt

          # AIWhatsAppService.kt
          echo 'package com.example.waairesp
          import android.accessibilityservice.AccessibilityService
          import android.content.Context
          import android.os.Bundle
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          class AIWhatsAppService : AccessibilityService() {
              companion object { var instance: AIWhatsAppService? = null }
              override fun onServiceConnected() { super.onServiceConnected(); instance = this }
              override fun onDestroy() { super.onDestroy(); if (instance == this) instance = null }
              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}
              fun sendAutomatedReply(replyText: String) {
                  val rootNode = rootInActiveWindow ?: return
                  typeAndSend(rootNode, replyText)
              }
              private fun typeAndSend(rootNode: AccessibilityNodeInfo, text: String) {
                  var entryNode: AccessibilityNodeInfo? = null
                  val possibleIds = listOf("com.whatsapp:id/entry", "com.whatsapp:id/conversation_text_entry")
                  for (id in possibleIds) {
                      val nodes = rootNode.findAccessibilityNodeInfosByViewId(id)
                      if (!nodes.isNullOrEmpty()) { entryNode = nodes[0]; break }
                  }
                  if (entryNode == null) { entryNode = findEditableNode(rootNode) }
                  if (entryNode != null && entryNode.isEditable) {
                      try {
                          val arguments = Bundle().apply { putCharSequence("ACTION_ARGUMENT_SET_TEXT_VALUE", text) }
                          entryNode.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, arguments)
                      } catch (e: Exception) {
                          val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as android.content.ClipboardManager
                          val clip = android.content.ClipData.newPlainText("ai_reply", text)
                          clipboard.setPrimaryClip(clip)
                          entryNode.performAction(AccessibilityNodeInfo.ACTION_FOCUS)
                          entryNode.performAction(AccessibilityNodeInfo.ACTION_PASTE)
                      }
                      trySendButton(rootNode)
                  }
              }
              private fun findEditableNode(node: AccessibilityNodeInfo?): AccessibilityNodeInfo? {
                  if (node == null) return null
                  if (node.isEditable) return node
                  for (i in 0 until node.childCount) {
                      val editable = findEditableNode(node.getChild(i))
                      if (editable != null) return editable
                  }
                  return null
              }
              private fun trySendButton(rootNode: AccessibilityNodeInfo) {
                  val sendIds = listOf("com.whatsapp:id/send", "com.whatsapp:id/ok_btn")
                  for (id in sendIds) {
                      val nodes = rootNode.findAccessibilityNodeInfosByViewId(id)
                      if (!nodes.isNullOrEmpty()) {
                          for (node in nodes) { if (node.isClickable) { node.performAction(AccessibilityNodeInfo.ACTION_CLICK); return } }
                      }
                  }
                  clickSendByDescription(rootNode)
              }
              private fun clickSendByDescription(node: AccessibilityNodeInfo?): Boolean {
                  if (node == null) return false
                  val desc = node.contentDescription?.toString()?.lowercase() ?: ""
                  val text = node.text?.toString()?.lowercase() ?: ""
                  if (desc.contains("send") || desc.contains("পাঠান") || text.contains("send")) {
                      if (node.isClickable) { return node.performAction(AccessibilityNodeInfo.ACTION_CLICK) }
                  }
                  for (i in 0 until node.childCount) { if (clickSendByDescription(node.getChild(i))) return true }
                  return false
              }
          }' > app/src/main/java/com/example/waairesp/AIWhatsAppService.kt

          # WA_NotificationListener.kt
          echo 'package com.example.waairesp
          import android.app.Notification
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification
          import android.content.Context
          import com.google.ai.client.generativeai.GenerativeModel
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          class WA_NotificationListener : NotificationListenerService() {
              private val scope = CoroutineScope(Dispatchers.IO)
              override fun onNotificationPosted(sbn: StatusBarNotification?) {
                  super.onNotificationPosted(sbn)
                  if (sbn == null) return
                  val pkg = sbn.packageName
                  if (pkg == "com.whatsapp") {
                      val extras = sbn.notification.extras
                      val title = extras.getString(Notification.EXTRA_TITLE)
                      val text = extras.getString(Notification.EXTRA_TEXT)
                      if (!text.isNullOrEmpty() && !title.isNullOrEmpty()) {
                          if (text.startsWith("You:") || text.contains("new messages")) return
                          processAIAutoReply(text)
                      }
                  }
              }
              private fun processAIAutoReply(incomingMessage: String) {
                  val prefs = getSharedPreferences("ai_bot_prefs", Context.MODE_PRIVATE)
                  val apiKey = prefs.getString("gemini_key", "") ?: ""
                  if (apiKey.isEmpty()) return
                  scope.launch {
                      try {
                          val generativeModel = GenerativeModel(modelName = "gemini-1.5-flash", apiKey = apiKey)
                          val prompt = "You are a helpful AI assistant replying on WhatsApp. Give a short, natural, and polite reply to this message: \"$incomingMessage\""
                          val response = generativeModel.generateContent(prompt)
                          val aiReply = response.text?.trim() ?: "Hello! Thanks for your message."
                          AIWhatsAppService.instance?.sendAutomatedReply(aiReply)
                      } catch (e: Exception) { e.printStackTrace() }
                  }
              }
          }' > app/src/main/java/com/example/waairesp/WA_NotificationListener.kt

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WA-AI-Responder-APK
          path: app/build/outputs/apk/debug/app-debug.apk
